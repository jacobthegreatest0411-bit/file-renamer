<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch File Renamer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f6f8fa;
            color: #24292f;
            border: 1px solid #d0d7de;
            border-radius: 6px;
        }
        h2 {
            border-bottom: 1px solid #d0d7de;
            padding-bottom: 8px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        /* Drag and Drop Zone Styles */
        #dropZone {
            border: 2px dashed #0969da;
            border-radius: 6px;
            padding: 30px 20px;
            text-align: center;
            background-color: #ffffff;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }
        #dropZone.dragover {
            background-color: #ddf4ff;
            border-color: #033d8b;
        }
        #dropZone p {
            margin: 0 0 10px 0;
            color: #57606a;
        }
        #fileInput {
            display: none; /* Hide the default ugly file input */
        }
        #fileCounter {
            font-size: 14px;
            color: #0969da;
            font-weight: 600;
            margin-top: 5px;
        }
        button {
            background-color: #2da44e;
            color: white;
            border: 1px solid rgba(27, 31, 36, 0.15);
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #2c974b;
        }
        button:disabled {
            background-color: #94d3a2;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Batch File Renamer</h2>
    <p>Drag & drop multiple files or click the box to upload. They will be renamed to 1, 2, 3... inside a ZIP archive.</p>

    <div class="form-group">
        <div id="dropZone" onclick="document.getElementById('fileInput').click()">
            <p><strong>Drag & drop files here</strong> or click to browse</p>
            <div id="fileCounter">No files selected</div>
        </div>
        <input type="file" id="fileInput" multiple>
    </div>

    <button id="renameBtn" onclick="renameAndDownload()">Rename & Download ZIP</button>

    <div id="status"></div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileCounter = document.getElementById('fileCounter');
        const status = document.getElementById('status');
        const button = document.getElementById('renameBtn');
        
        let selectedFiles = [];

        // --- Drag and Drop Event Listeners ---

        // Prevent browser from opening the file when dropped
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // Visual highlights when hovering files over the zone
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        // Handle dropped files
        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            if (dt.files.length > 0) {
                selectedFiles = Array.from(dt.files);
                updateFileCounter();
            }
        });

        // Handle standard file selection via click/dialog
        fileInput.addEventListener('change', (e) => {
            if (fileInput.files.length > 0) {
                selectedFiles = Array.from(fileInput.files);
                updateFileCounter();
            }
        });

        function updateFileCounter() {
            status.innerText = ""; // Clear any old error messages
            if (selectedFiles.length === 1) {
                fileCounter.innerText = "1 file selected";
            } else {
                fileCounter.innerText = `${selectedFiles.length} files selected`;
            }
        }

        // --- Core Renaming Logic ---

        async function renameAndDownload() {
            if (selectedFiles.length === 0) {
                status.style.color = '#cf222e';
                status.innerText = "Please select or drop some files first.";
                return;
            }

            button.disabled = true;
            status.style.color = '#24292f';
            status.innerText = "Processing files... Please wait.";

            const zip = new JSZip();

            // Sort files naturally by original name so 1, 2, 3 matches their current order
            selectedFiles.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));

            selectedFiles.forEach((file, index) => {
                const extension = file.name.substring(file.name.lastIndexOf('.'));
                const newName = `${index + 1}${extension}`;
                zip.file(newName, file);
            });

            try {
                const content = await zip.generateAsync({ type: "blob" });
                
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = "renamed_files.zip";
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                status.style.color = '#2da44e';
                status.innerText = `Success! ${selectedFiles.length} files bundled and downloaded.`;
            } catch (error) {
                console.error(error);
                status.style.color = '#cf222e';
                status.innerText = "An error occurred while creating the ZIP file.";
            } finally {
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
